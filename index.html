<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Racer</title>
<style>
  body{margin:0;background:#07040f;color:#eee;font-family:system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
  canvas{width:min(100%,1280px);height:auto;border-radius:14px;background:#000;
         box-shadow:0 0 60px #ff2f8744,0 0 120px #2de2ff22}
  button{padding:12px 28px;border:none;border-radius:10px;background:linear-gradient(90deg,#2de2ff,#7b5cff);
         color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
  button:hover{filter:brightness(1.15)}
  button.rec{background:linear-gradient(90deg,#ff2f6e,#ff7a3d)}
  .status{font-size:12px;opacity:.65;text-align:center;line-height:1.6}
</style>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<button id="btn">🎬 Mulai Rekam</button>
<div class="status" id="status">Memuat aset…</div>

<script>
// ============================================================
//  KONFIGURASI ASET — ganti sesuai nama file di repo
//  (sprite tampak BELAKANG, background transparan lebih bagus)
//  Kalau file tidak ada → otomatis pakai gambar buatan Canvas.
// ============================================================
const ASSETS = {
  player : 'assets/car.png',
  enemies: ['assets/enemy.png','assets/enemy2.png'],   // boleh banyak: ['assets/e1.png','assets/e2.png']
  tree   : 'assets/tree.png'
};

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const TAU = Math.PI*2, rnd = (a,b)=>a+Math.random()*(b-a);
const lerp = (a,b,p)=>a+(b-a)*p;
const mk = (w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

// ============================================================
//  PARAMETER DUNIA
// ============================================================
const roadW=2000, segL=200, lanes=3, camH=1000, drawDist=300, fogDensity=5;
const camDepth = 1/Math.tan(50*Math.PI/180), playerZ = camH*camDepth;
const maxSpeed = 11000, FOG = '#2a1245';

// ============================================================
//  TRACK
// ============================================================
let segments=[], trackLength=0;
const easeIn=(a,b,p)=>a+(b-a)*p*p;
const easeInOut=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+0.5);
const lastY=()=>segments.length?segments[segments.length-1].p2.world.y:0;

function addSeg(curve,y){
  const n=segments.length, a=Math.floor(n/3)%2;
  segments.push({
    index:n, curve, cars:[], sprites:[],
    p1:{world:{y:lastY(),z:n*segL},camera:{},screen:{}},
    p2:{world:{y,z:(n+1)*segL},camera:{},screen:{}},
    c:{ road:a?'#2b2b3b':'#303044', grass:a?'#0f2219':'#0c1c15',
        rumble:a?'#ff3d6e':'#f4f4f8', lane:a?'#d8d8ea':null }
  });
}
function addRoad(e,h,l,curve,hgt){
  const sy=lastY(), ey=sy+hgt*segL, t=e+h+l;
  for(let n=0;n<e;n++) addSeg(easeIn(0,curve,n/e), easeInOut(sy,ey,n/t));
  for(let n=0;n<h;n++) addSeg(curve, easeInOut(sy,ey,(e+n)/t));
  for(let n=0;n<l;n++) addSeg(easeInOut(curve,0,n/l), easeInOut(sy,ey,(e+h+n)/t));
}
function buildTrack(){
  [[25,0,0],[40,4,0],[30,0,25],[50,-5,10],[25,0,-20],[60,6,0],
   [30,-3,30],[40,0,-35],[50,-6,0],[30,0,-10]]
  .forEach(([n,c,h])=>addRoad(n,n,n,c,h));
  segments[0].c={road:'#fff',grass:'#0c1c15',rumble:'#fff',lane:'#fff'};
  segments[1].c={road:'#111',grass:'#0c1c15',rumble:'#111',lane:'#111'};
  trackLength=segments.length*segL;

  const billTxt=[['TURBO','#2de2ff'],['NITRO','#ff2f87'],['RACE','#ffe66b'],['SPEED','#7bff9a']];
  segments.forEach((s,n)=>{
    if(n%7===0) for(const side of [-1,1]) if(Math.random()<.7)
      s.sprites.push({kind:'tree',offset:side*rnd(1.6,4),w:rnd(.7,1.1),r:1.7});
    if(n%10===0) s.sprites.push({kind:'lamp',offset:(n%20?1:-1)*1.4,w:.45,r:2.4,side:(n%20?1:-1)});
    if(n%80===40){const b=billTxt[(n/80|0)%4]; const sd=(n/80|0)%2?1:-1;
      s.sprites.push({kind:'bill',offset:sd*2.1,w:1.3,r:.95,txt:b[0],col:b[1]});}
  });
}

// ============================================================
//  BACKGROUND (pra-render)
// ============================================================
let skyCv, vigCv, layers=[];
function makeBg(){
  const hz=H/2+10;
  skyCv=mk(W,H); const g=skyCv.getContext('2d');
  let gr=g.createLinearGradient(0,0,0,hz);
  gr.addColorStop(0,'#06031a');gr.addColorStop(.45,'#2a0b5a');gr.addColorStop(.8,'#a3216e');gr.addColorStop(1,'#ff7a5c');
  g.fillStyle=gr; g.fillRect(0,0,W,hz);
  for(let i=0;i<130;i++){g.fillStyle=`rgba(255,255,255,${rnd(.2,.9)})`;g.fillRect(rnd(0,W),rnd(0,H*.34),rnd(1,2.2),rnd(1,2.2));}
  const cx=W*.5, cy=H*.39, r=110;
  gr=g.createRadialGradient(cx,cy,r*.6,cx,cy,r*2.6);
  gr.addColorStop(0,'rgba(255,60,140,.45)');gr.addColorStop(1,'rgba(255,60,140,0)');
  g.fillStyle=gr; g.fillRect(0,0,W,hz);
  const sun=mk(r*2,r*2), sg=sun.getContext('2d');
  gr=sg.createLinearGradient(0,0,0,r*2); gr.addColorStop(0,'#ffe66b');gr.addColorStop(1,'#ff2f87');
  sg.fillStyle=gr; sg.beginPath(); sg.arc(r,r,r,0,TAU); sg.fill();
  sg.globalCompositeOperation='destination-out';
  for(let i=0;i<6;i++) sg.fillRect(0,r+8+i*17,r*2,2+i*2.2);
  g.drawImage(sun,cx-r,cy-r);

  const mount=(h,base,amp,color,ks,ph)=>{
    const c=mk(W,h),q=c.getContext('2d'); q.fillStyle=color; q.beginPath(); q.moveTo(0,h);
    for(let x=0;x<=W;x+=4){
      const s=Math.sin(TAU*ks[0]*x/W+ph[0])+.5*Math.sin(TAU*ks[1]*x/W+ph[1])+.25*Math.sin(TAU*ks[2]*x/W+ph[2]);
      q.lineTo(x,h-(base+amp*.5*(s/1.75+1)));
    } q.lineTo(W,h); q.fill(); return c;};
  const far=mount(200,40,110,'#3a1260',[2,5,11],[0,1.7,4]);
  const near=mount(150,25,80,'#1d0b3d',[3,7,13],[2,.4,5]);
  const city=mk(W,170), q=city.getContext('2d'); q.fillStyle='#120826';
  for(let x=0;x<W;){
    const bw=Math.min(rnd(26,64),W-x), bh=rnd(40,150);
    q.fillStyle='#120826'; q.fillRect(x,170-bh,bw,bh);
    for(let wy=170-bh+8;wy<165;wy+=10) for(let wx=x+5;wx<x+bw-5;wx+=8)
      if(Math.random()<.35){q.fillStyle=Math.random()<.5?'rgba(45,226,255,.8)':'rgba(255,90,160,.8)';q.fillRect(wx,wy,3,4);}
    x+=bw+rnd(0,6);
  }
  layers=[[far,.25,hz-200+2],[near,.5,hz-150+2],[city,.9,hz-170+2]];

  vigCv=mk(W,H); const v=vigCv.getContext('2d');
  gr=v.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.6)');
  v.fillStyle=gr; v.fillRect(0,0,W,H);
}

// ============================================================
//  GAMBAR MANUAL (fallback) — origin = tengah-bawah
// ============================================================
function carShape(g,w,h,hue,brake){
  g.fillStyle='rgba(0,0,0,.5)'; g.beginPath(); g.ellipse(0,-h*.02,w*.56,h*.1,0,0,TAU); g.fill();
  g.fillStyle='#0d0d12';
  g.fillRect(-w*.47,-h*.24,w*.16,h*.24); g.fillRect(w*.31,-h*.24,w*.16,h*.24);
  let gr=g.createLinearGradient(0,-h*.9,0,-h*.2);
  gr.addColorStop(0,`hsl(${hue},85%,62%)`); gr.addColorStop(1,`hsl(${hue},85%,32%)`);
  g.fillStyle=gr; g.beginPath(); g.roundRect(-w/2,-h*.64,w,h*.44,h*.09); g.fill();
  g.beginPath(); g.moveTo(-w*.38,-h*.6); g.lineTo(-w*.27,-h); g.lineTo(w*.27,-h); g.lineTo(w*.38,-h*.6); g.closePath(); g.fill();
  gr=g.createLinearGradient(0,-h*.95,0,-h*.64);
  gr.addColorStop(0,'#355a9a'); gr.addColorStop(1,'#0a1430');
  g.fillStyle=gr; g.beginPath(); g.moveTo(-w*.32,-h*.64); g.lineTo(-w*.23,-h*.94); g.lineTo(w*.23,-h*.94); g.lineTo(w*.32,-h*.64); g.closePath(); g.fill();
  g.fillStyle='#0b0b10'; g.beginPath(); g.roundRect(-w/2,-h*.26,w,h*.1,h*.03); g.fill();
  g.fillStyle='#eee'; g.fillRect(-w*.12,-h*.42,w*.24,h*.1);
  if(w>14){ g.shadowColor='#ff2a3a'; g.shadowBlur=brake?w*.25:w*.1; }
  g.fillStyle=brake?'#ff5058':'#e02030';
  g.fillRect(-w*.47,-h*.56,w*.3,h*.1); g.fillRect(w*.17,-h*.56,w*.3,h*.1);
  g.shadowBlur=0;
}
function pine(g,w,h){
  g.fillStyle='#2b1a2e'; g.fillRect(-w*.06,-h*.2,w*.12,h*.2);
  for(let i=0;i<3;i++){
    const by=-h*(.14+i*.26), tw=w*(.5-i*.12);
    g.fillStyle=i%2?'#0e4a3a':'#126049';
    g.beginPath(); g.moveTo(-tw,by); g.lineTo(0,by-h*.42); g.lineTo(tw,by); g.closePath(); g.fill();
    g.strokeStyle='rgba(255,90,160,.35)'; g.lineWidth=Math.max(1,w*.015); g.stroke();
  }
}
function lamp(g,w,h,side){
  g.strokeStyle='#2a2a3a'; g.lineWidth=Math.max(1.5,w*.07);
  g.beginPath(); g.moveTo(0,0); g.lineTo(0,-h); g.lineTo(-side*w*.9,-h); g.stroke();
  const bx=-side*w*.9, by=-h, gl=Math.max(6,w*1.2);
  g.globalCompositeOperation='lighter';
  const gr=g.createRadialGradient(bx,by,0,bx,by,gl);
  gr.addColorStop(0,'rgba(255,230,160,.95)'); gr.addColorStop(1,'rgba(255,150,80,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(bx,by,gl,0,TAU); g.fill();
}
function bill(g,w,h,s){
  g.fillStyle='#1b1b26'; g.fillRect(-w*.32,-h*.55,w*.04,h*.55); g.fillRect(w*.28,-h*.55,w*.04,h*.55);
  if(w>40){g.shadowColor=s.col;g.shadowBlur=w*.08;}
  g.fillStyle='#12082b'; g.strokeStyle=s.col; g.lineWidth=Math.max(1,w*.025);
  g.beginPath(); g.roundRect(-w/2,-h,w,h*.5,w*.03); g.fill(); g.stroke();
  if(w>30){g.fillStyle=s.col;g.font=`800 ${w*.17}px system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(s.txt,0,-h*.75);}
  g.shadowBlur=0;
}

// ============================================================
//  ASET + MOBIL
// ============================================================
const img={player:null,tree:null,enemies:[]};
const cars=[];
function initCars(){
  for(let i=0;i<14;i++){
    const c={offset:[-.6,0,.6][i%3]+rnd(-.1,.1), z:rnd(0,trackLength-segL)+segL*10,
             speed:maxSpeed*rnd(.32,.58), hue:(i*47+rnd(0,30))%360,
             img:img.enemies.length?img.enemies[i%img.enemies.length]:null, pct:0};
    cars.push(c); findSeg(c.z).cars.push(c);
  }
}

// ============================================================
//  HELPER
// ============================================================
const findSeg=z=>segments[Math.floor(z/segL)%segments.length];
const pctRem=n=>(n%segL)/segL;
const inc=(v,i)=>{v+=i; while(v>=trackLength)v-=trackLength; while(v<0)v+=trackLength; return v;};
const fogF=d=>1/Math.exp(d*d*fogDensity);

function project(p,cx,cy,cz){
  p.camera.x=(p.world.x||0)-cx; p.camera.y=p.world.y-cy; p.camera.z=p.world.z-cz;
  p.screen.scale=camDepth/p.camera.z;
  p.screen.x=Math.round(W/2+p.screen.scale*p.camera.x*W/2);
  p.screen.y=Math.round(H/2-p.screen.scale*p.camera.y*H/2);
  p.screen.w=Math.round(p.screen.scale*roadW*W/2);
}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,c){
  ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill();
}

// ============================================================
//  STATE + UPDATE
// ============================================================
let position=0, speed=0, playerX=0, tgt=0, steer=0, shake=0, braking=false;
let lap=1, lapStart=0, bestLap=null;
const lanesX=[-.6,0,.6];

function steerAI(){
  const pz=position+playerZ, clear=lanesX.map(()=>9999);
  for(const c of cars){
    if(c.speed>=speed) continue;
    let dz=c.z-pz; if(dz<0) dz+=trackLength; if(dz>4500) continue;
    lanesX.forEach((L,i)=>{ if(Math.abs(c.offset-L)<.4) clear[i]=Math.min(clear[i],dz); });
  }
  const ci=Math.max(0,lanesX.indexOf(tgt));
  if(clear[ci]<3200){
    let best=ci;
    clear.forEach((v,i)=>{ if(Math.abs(i-ci)<=1 && v>clear[best]+300) best=i; });
    tgt=lanesX[best];
  }
}

function update(dt,t){
  const tSpeed=maxSpeed*(.78+.22*Math.sin(t/3500)), prev=speed;
  speed+=(tSpeed-speed)*Math.min(1,dt*.8);
  braking=speed-prev<-4;
  const old=position; position=inc(position,dt*speed);
  if(position<old){ const lt=(t-lapStart)/1000; if(bestLap===null||lt<bestLap) bestLap=lt; lap++; lapStart=t; }

  const pSeg=findSeg(position+playerZ), pct=speed/maxSpeed;
  steerAI();
  playerX+=(tgt+Math.sin(t/900)*.04-playerX)*Math.min(1,dt*5);
  playerX-=dt*2*pct*pct*pSeg.curve*.08;
  playerX=Math.max(-.85,Math.min(.85,playerX));
  steer+=((tgt-playerX)*2.5-pSeg.curve*.12*pct-steer)*Math.min(1,dt*6);
  steer=Math.max(-1,Math.min(1,steer));

  for(const c of cars){
    const o=findSeg(c.z);
    for(let n=1;n<=20;n++){
      const s=segments[(o.index+n)%segments.length];
      for(const k of s.cars) if(k!==c&&k.speed<c.speed&&Math.abs(k.offset-c.offset)<.3){
        const dir=k.offset>.5?-1:k.offset<-.5?1:(c.offset>k.offset?1:-1);
        c.offset+=dir*dt*.9;
      }
    }
    c.offset=Math.max(-.8,Math.min(.8,c.offset));
    c.z=inc(c.z,dt*c.speed); c.pct=pctRem(c.z);
    const nw=findSeg(c.z);
    if(nw!==o){ o.cars.splice(o.cars.indexOf(c),1); nw.cars.push(c); }
  }
  for(const c of pSeg.cars) if(speed>c.speed&&Math.abs(playerX-c.offset)<.28){
    speed=c.speed*.6; position=inc(c.z,-playerZ); shake=1; break;
  }
  shake=Math.max(0,shake-dt*2.5);
}

// ============================================================
//  RENDER
// ============================================================
function renderSeg(s){
  const {x:x1,y:y1,w:w1}=s.p1.screen, {x:x2,y:y2,w:w2}=s.p2.screen;
  const m=Math.max(6,2*lanes), r1=w1/m, r2=w2/m;
  ctx.fillStyle=s.c.grass; ctx.fillRect(0,y2,W,y1-y2);
  poly(x1-w1-r1,y1,x1-w1,y1,x2-w2,y2,x2-w2-r2,y2,s.c.rumble);
  poly(x1+w1+r1,y1,x1+w1,y1,x2+w2,y2,x2+w2+r2,y2,s.c.rumble);
  poly(x1-w1,y1,x1+w1,y1,x2+w2,y2,x2-w2,y2,s.c.road);
  if(s.c.lane){
    const lm=Math.max(32,8*lanes), l1=w1/lm, l2=w2/lm, lw1=w1*2/lanes, lw2=w2*2/lanes;
    let lx1=x1-w1+lw1, lx2=x2-w2+lw2;
    for(let l=1;l<lanes;l++,lx1+=lw1,lx2+=lw2)
      poly(lx1-l1/2,y1,lx1+l1/2,y1,lx2+l2/2,y2,lx2-l2/2,y2,s.c.lane);
  }
  if(s.fog<1){ ctx.globalAlpha=1-s.fog; ctx.fillStyle=FOG; ctx.fillRect(0,y2,W,y1-y2); ctx.globalAlpha=1; }
}

function actor(x,y,clip,fog,fn){
  ctx.save();
  if(y>clip){ ctx.beginPath(); ctx.rect(0,0,W,clip); ctx.clip(); }
  ctx.globalAlpha=.25+.75*fog; ctx.translate(x,y); fn(); ctx.restore();
}
function drawCar(c,x,y,sc,clip,fog){
  const w=.26*sc*roadW*W/2; if(w<4) return;
  const im=c.img, h=im?w*im.height/im.width:w*.6;
  actor(x,y,clip,fog,()=>{
    if(im){ ctx.fillStyle='rgba(0,0,0,.45)'; ctx.beginPath(); ctx.ellipse(0,-h*.02,w*.55,h*.1,0,0,TAU); ctx.fill(); ctx.drawImage(im,-w/2,-h,w,h); }
    else carShape(ctx,w,h,c.hue,false);
  });
}
function drawSprite(sp,x,y,sc,clip,fog){
  const w=sp.w*sc*roadW*W/2; if(w<3) return;
  let h=w*sp.r;
  if(sp.kind==='tree'&&img.tree) h=w*img.tree.height/img.tree.width;
  actor(x,y,clip,fog,()=>{
    if(sp.kind==='tree'){ img.tree?ctx.drawImage(img.tree,-w/2,-h,w,h):pine(ctx,w,h); }
    else if(sp.kind==='lamp') lamp(ctx,w,h,sp.side);
    else bill(ctx,w,h,sp);
  });
}

function layer(c,mul,y,off){
  const o=(((off*mul)%W)+W)%W; ctx.drawImage(c,-o,y); ctx.drawImage(c,W-o,y);
}

let bgOff=0;
function render(t,dt){
  const baseSeg=findSeg(position), basePct=pctRem(position);
  const pSeg=findSeg(position+playerZ), pPct=pctRem(position+playerZ);
  const playerY=lerp(pSeg.p1.world.y,pSeg.p2.world.y,pPct), pct=speed/maxSpeed;
  bgOff+=pSeg.curve*pct*dt*160;

  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*18*shake,(Math.random()-.5)*18*shake);
  ctx.drawImage(skyCv,0,0);
  for(const [c,m,y] of layers) layer(c,m,y,bgOff);
  ctx.fillStyle='#0c1c15'; ctx.fillRect(0,H/2+8,W,H/2);

  let maxy=H, x=0, dx=-(baseSeg.curve*basePct);
  for(let n=0;n<drawDist;n++){
    const s=segments[(baseSeg.index+n)%segments.length];
    s.looped=s.index<baseSeg.index; s.fog=fogF(n/drawDist); s.clip=maxy;
    const cz=position-(s.looped?trackLength:0);
    project(s.p1,playerX*roadW-x,playerY+camH,cz);
    project(s.p2,playerX*roadW-x-dx,playerY+camH,cz);
    x+=dx; dx+=s.curve;
    if(s.p1.camera.z<=camDepth||s.p2.screen.y>=s.p1.screen.y||s.p2.screen.y>=maxy) continue;
    renderSeg(s); maxy=s.p1.screen.y;
  }
  for(let n=drawDist-1;n>0;n--){
    const s=segments[(baseSeg.index+n)%segments.length];
    if(s.p1.camera.z<=camDepth) continue;
    for(const c of s.cars){
      const sc=lerp(s.p1.screen.scale,s.p2.screen.scale,c.pct);
      drawCar(c,lerp(s.p1.screen.x,s.p2.screen.x,c.pct)+sc*c.offset*roadW*W/2,
              lerp(s.p1.screen.y,s.p2.screen.y,c.pct),sc,s.clip,s.fog);
    }
    for(const sp of s.sprites){
      const sc=s.p1.screen.scale;
      drawSprite(sp,s.p1.screen.x+sc*sp.offset*roadW*W/2,s.p1.screen.y,sc,s.clip,s.fog);
    }
  }

  // mobil pemain
  const ps=camDepth/playerZ, pw=.27*ps*roadW*W/2;
  const ph=img.player?pw*img.player.height/img.player.width:pw*.6;
  const py=H/2-ps*lerp(pSeg.p1.camera.y,pSeg.p2.camera.y,pPct)*H/2-H*.05+(Math.random()-.5)*3*pct;
  ctx.save(); ctx.translate(W/2+steer*18,py); ctx.rotate(steer*.05);
  if(img.player){
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.beginPath(); ctx.ellipse(0,-ph*.02,pw*.56,ph*.1,0,0,TAU); ctx.fill();
    ctx.drawImage(img.player,-pw/2,-ph,pw,ph);
  } else carShape(ctx,pw,ph,195,braking);
  ctx.restore();

  // cahaya lampu depan
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.translate(W/2,H*.78); ctx.scale(1,.4);
  const hg=ctx.createRadialGradient(0,0,10,0,0,420);
  hg.addColorStop(0,'rgba(255,240,200,.16)'); hg.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=hg; ctx.fillRect(-500,-500,1000,1000); ctx.restore();

  // speed lines
  if(pct>.8){
    ctx.strokeStyle=`rgba(255,255,255,${(pct-.8)*1.4})`; ctx.lineWidth=2;
    for(let i=0;i<14;i++){
      const a=rnd(0,TAU), r1=H*rnd(.45,.65), r2=r1+rnd(40,140);
      ctx.beginPath(); ctx.moveTo(W/2+Math.cos(a)*r1*1.5,H/2+Math.sin(a)*r1);
      ctx.lineTo(W/2+Math.cos(a)*r2*1.5,H/2+Math.sin(a)*r2); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.drawImage(vigCv,0,0);
  hud(t);
}

function fmt(s){const m=Math.floor(s/60);return `${m}:${(s%60).toFixed(2).padStart(5,'0')}`;}
function hud(t){
  const kmh=Math.round(speed/maxSpeed*296), pct=speed/maxSpeed;
  ctx.save(); ctx.shadowColor='#2de2ff'; ctx.shadowBlur=16;
  ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font='italic 800 68px system-ui,sans-serif'; ctx.fillText(kmh,44,H-64);
  ctx.font='700 16px system-ui,sans-serif'; ctx.fillStyle='#2de2ff'; ctx.fillText('KM/H',48,H-42);
  ctx.shadowBlur=0;
  for(let i=0;i<26;i++){
    const on=i/26<pct; ctx.fillStyle=on?`hsl(${190-i*7},95%,58%)`:'rgba(255,255,255,.12)';
    ctx.fillRect(44+i*11,H-30,8,10);
  }
  ctx.textAlign='right'; ctx.shadowBlur=12; ctx.shadowColor='#ff2f87';
  ctx.fillStyle='#fff'; ctx.font='italic 800 30px system-ui,sans-serif'; ctx.fillText(`LAP ${lap}`,W-44,H-76);
  ctx.font='600 22px system-ui,sans-serif'; ctx.fillStyle='#ffd3e6'; ctx.fillText(fmt((t-lapStart)/1000),W-44,H-46);
  if(bestLap!==null){ ctx.font='600 15px system-ui,sans-serif'; ctx.fillStyle='#2de2ff'; ctx.fillText('BEST '+fmt(bestLap),W-44,H-24); }
  ctx.restore();
}

// ============================================================
//  LOOP + BOOT
// ============================================================
let last=performance.now(), started=false;
function loop(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  update(dt,now); render(now,dt);
  requestAnimationFrame(loop);
}

const load=src=>new Promise(r=>{const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>r(im); im.onerror=()=>r(null); im.src=src;});

(async()=>{
  buildTrack(); makeBg();
  const names=['player','tree',...ASSETS.enemies.map((_,i)=>'enemy'+(i+1))];
  const res=await Promise.all([load(ASSETS.player),load(ASSETS.tree),...ASSETS.enemies.map(load)]);
  img.player=res[0]; img.tree=res[1]; img.enemies=res.slice(2).filter(Boolean);
  initCars();
  const srcs=[ASSETS.player,ASSETS.tree,...ASSETS.enemies];
  document.getElementById('status').innerHTML=
    res.map((r,i)=>r?`✅ ${names[i]} (${srcs[i]})`:`❌ ${names[i]} — pakai gambar bawaan`).join('<br>');
  started=true; lapStart=performance.now(); last=performance.now();
  requestAnimationFrame(loop);
})();

// ============================================================
//  REKAM VIDEO
// ============================================================
let recorder, chunks=[], tick;
const btn=document.getElementById('btn');
btn.onclick=()=>{
  if(!started){ alert('Tunggu aset selesai dimuat dulu ya'); return; }
  if(recorder&&recorder.state==='recording'){ recorder.stop(); return; }
  const stream=cv.captureStream(60);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12_000_000});
  chunks=[]; recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
    clearInterval(tick);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='neon-racer.webm'; a.click();
    btn.textContent='🎬 Mulai Rekam'; btn.classList.remove('rec');
  };
  recorder.start();
  const t0=Date.now(); btn.classList.add('rec');
  const upd=()=>btn.textContent=`⏹ Stop & Unduh (${Math.floor((Date.now()-t0)/1000)}s)`;
  upd(); tick=setInterval(upd,500);
};
</script>
